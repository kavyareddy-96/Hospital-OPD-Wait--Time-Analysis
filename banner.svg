<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f1b2d"/>
      <stop offset="100%" stop-color="#102a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- decorative faint heartbeat / ECG line across the banner -->
  <polyline points="0,300 140,300 175,300 210,220 245,360 280,150 315,300 360,300 1200,300"
            fill="none" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="3"/>
  <polyline points="0,330 140,330 175,330 210,250 245,390 280,180 315,330 360,330 1200,330"
            fill="none" stroke="#38bdf8" stroke-opacity="0.10" stroke-width="2"/>

  <!-- faint grid dots -->
  <g fill="#2dd4bf" opacity="0.08">
    <circle cx="80" cy="60" r="3"/>
    <circle cx="160" cy="60" r="3"/>
    <circle cx="240" cy="60" r="3"/>
    <circle cx="1000" cy="70" r="3"/>
    <circle cx="1080" cy="70" r="3"/>
    <circle cx="1120" cy="120" r="3"/>
    <circle cx="60" cy="340" r="3"/>
    <circle cx="1140" cy="330" r="3"/>
  </g>

  <!-- large faint medical cross, right side -->
  <g opacity="0.09" fill="#2dd4bf">
    <rect x="1000" y="60" width="140" height="46" rx="8"/>
    <rect x="1050" y="10" width="46" height="146" rx="8"/>
  </g>

  <!-- clock icon, left side, faint -->
  <g opacity="0.10" stroke="#38bdf8" stroke-width="6" fill="none">
    <circle cx="110" cy="230" r="55"/>
    <line x1="110" y1="230" x2="110" y2="195"/>
    <line x1="110" y1="230" x2="135" y2="245"/>
  </g>

  <!-- top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- eyebrow tag -->
  <text x="90" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="4"
        fill="#38bdf8" font-weight="600">HEALTHCARE ANALYTICS PROJECT</text>

  <!-- main title -->
  <text x="88" y="210" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#f8fafc">
    OPD Patient
  </text>
  <text x="88" y="280" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#f8fafc">
    Wait-Time Analysis
  </text>

  <!-- subtitle -->
  <text x="90" y="330" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#94a3b8">
    SQL  •  Power BI  •  Excel
  </text>
</svg>
